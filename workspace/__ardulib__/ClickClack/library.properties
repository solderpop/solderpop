name=ClickClack
version=0.1.0
author=SolderPop
maintainer=SolderPop <dev@solderpop.io>
sentence=Named pin and I2C address constants for SolderPop ClickClack boards.
paragraph=Maps the ClickClack 34-pin connector signals (I2C, UART, ADC, interrupt, addressable LED) to real GPIO numbers, and lists the fixed I2C addresses used by ClickClack sensor/power add-on boards, so sketches and native node implementations can refer to signals by name instead of raw pin numbers.<br />ClickClack Spark (ESP32-C3) is fully mapped. ClickClack Horizon (nRF52840) pin mapping is not yet finalized in the hardware spec (see README) and is intentionally left unimplemented rather than guessed.
category=Device Control
url=https://solderpop.io
architectures=esp32,nrf52
includes=ClickClack.h
